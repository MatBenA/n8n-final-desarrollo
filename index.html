<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Agente · Consola</title>
<style>
  :root{
    --bg: #0d1210;
    --panel: #131a17;
    --panel-2: #182019;
    --line: #24322b;
    --text: #e7ede9;
    --dim: #7f9186;
    --accent: #5ee6a8;
    --accent-dim: #2a5c46;
    --user-bubble: #1c2921;
    --bot-bubble: #182019;
    --error: #e6725e;
    --mono: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(94,230,168,0.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family: var(--mono);
    display:flex;
    flex-direction:column;
    height:100dvh;
    overflow:hidden;
  }

  /* header */
  header{
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .dot{
    width:9px; height:9px; border-radius:50%;
    background: var(--dim);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.03);
    transition: background .2s, box-shadow .2s;
    flex-shrink:0;
  }
  .dot.online{ background: var(--accent); box-shadow: 0 0 10px rgba(94,230,168,0.6), 0 0 0 3px rgba(94,230,168,0.12); }
  .dot.busy{ background:#e6c15e; box-shadow: 0 0 10px rgba(230,193,94,0.6), 0 0 0 3px rgba(230,193,94,0.12); }
  .dot.error{ background: var(--error); box-shadow: 0 0 10px rgba(230,114,94,0.6), 0 0 0 3px rgba(230,114,94,0.12); }
  h1{ font-size:13px; font-weight:600; letter-spacing:0.02em; margin:0; text-transform:uppercase; color:var(--text); }
  .sub{ font-size:11px; color:var(--dim); margin-top:1px; }

  /* messages */
  #messages{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:22px 18px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  #messages::-webkit-scrollbar{ width:8px; }
  #messages::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }

  .row{ display:flex; }
  .row.user{ justify-content:flex-end; }
  .row.bot{ justify-content:flex-start; }

  .bubble{
    max-width:72%;
    padding:10px 13px;
    border-radius:10px;
    font-size:13.5px;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .row.user .bubble{
    background:var(--user-bubble);
    border:1px solid var(--accent-dim);
    border-bottom-right-radius:2px;
  }
  .row.bot .bubble{
    background:var(--bot-bubble);
    border:1px solid var(--line);
    border-bottom-left-radius:2px;
  }
  .row.bot .bubble.error{ border-color:var(--error); color:#f3d3cb; }
  .tag{
    font-size:9.5px; color:var(--dim); text-transform:uppercase; letter-spacing:0.06em;
    margin-bottom:4px; display:block;
  }

  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--dim);
    max-width:360px;
  }
  .empty-state .glyph{ font-size:28px; margin-bottom:10px; opacity:0.7; }
  .empty-state .big{ color:var(--text); font-size:13px; margin-bottom:6px; }
  .empty-state .small{ font-size:11.5px; line-height:1.6; }

  .typing{ display:flex; gap:4px; padding:4px 0; }
  .typing span{
    width:6px; height:6px; border-radius:50%; background:var(--dim);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:.2s; }
  .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{ opacity:0.25; } 40%{ opacity:1; } }

  /* input bar */
  #inputbar{
    border-top:1px solid var(--line);
    background:var(--panel);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    display:flex;
    gap:10px;
    align-items:flex-end;
    flex-shrink:0;
  }
  #msginput{
    flex:1;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:16px; /* 16px avoids iOS Safari auto-zoom on focus */
    padding:11px 13px;
    border-radius:8px;
    outline:none;
    resize:none;
    max-height:120px;
    line-height:1.4;
  }
  #msginput:focus{ border-color:var(--accent-dim); }
  #send{
    background:var(--accent);
    color:#08130e;
    border:none;
    font-family:var(--mono);
    font-weight:700;
    font-size:12px;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
    letter-spacing:0.02em;
    text-transform:uppercase;
    flex-shrink:0;
  }
  #send:disabled{ background:var(--panel-2); color:var(--dim); cursor:not-allowed; }
  #send:not(:disabled):hover{ filter:brightness(1.08); }
</style>
</head>
<body>

<header>
  <span class="dot" id="statusDot"></span>
  <div>
    <h1>Consola del agente</h1>
    <div class="sub" id="statusText">Conectando…</div>
  </div>
</header>

<div id="messages">
  <div class="empty-state" id="emptyState">
    <div class="glyph">◆</div>
    <div class="big">Conectando con el agente…</div>
    <div class="small">En un momento vas a poder escribirle.</div>
  </div>
</div>

<div id="inputbar">
  <textarea id="msginput" rows="1" placeholder="Escribí un mensaje…" disabled></textarea>
  <button id="send" disabled>Enviar</button>
</div>

<script>
(function(){
  // --- Configuración fija del agente ---
  const WEBHOOK_URL = 'https://swipe-violate-backroom.ngrok-free.dev/webhook/1628e349-dbce-487f-9425-913b178f45d6';
  const FIELD_MESSAGE = 'chatInput';
  const FIELD_SESSION = 'sessionId';
  const FIELD_RESPONSE = 'output';

  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const messages = document.getElementById('messages');
  const emptyState = document.getElementById('emptyState');
  const msgInput = document.getElementById('msginput');
  const sendBtn = document.getElementById('send');

  const sessionId = 'web-' + Math.random().toString(36).slice(2, 10);

  function setStatus(state, text){
    statusDot.className = 'dot ' + state;
    statusText.textContent = text;
  }

  function autoresize(){
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  }
  msgInput.addEventListener('input', autoresize);

  function enableChat(on){
    msgInput.disabled = !on;
    sendBtn.disabled = !on;
  }

  function addBubble(role, text, isError){
    if(emptyState.parentElement) emptyState.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'bot');
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (isError ? ' error' : '');
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = role === 'user' ? 'vos' : (isError ? 'error' : 'agente');
    bubble.appendChild(tag);
    const body = document.createElement('div');
    body.textContent = text;
    bubble.appendChild(body);
    row.appendChild(bubble);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return bubble;
  }

  function addTyping(){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingRow';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<span class="tag">agente</span><div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(bubble);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  }
  function removeTyping(){
    const row = document.getElementById('typingRow');
    if(row) row.remove();
  }

  function extractResponseText(data, fieldName){
    if (typeof data === 'string') return data;
    let obj = data;
    if (Array.isArray(data)) obj = data[0];
    if (obj && typeof obj === 'object'){
      if (fieldName && obj[fieldName] !== undefined) return String(obj[fieldName]);
      for (const key of ['output','response','text','answer','message','reply']){
        if (obj[key] !== undefined) return String(obj[key]);
      }
      return JSON.stringify(obj, null, 2);
    }
    return String(data);
  }

  async function callWebhook(userText){
    const body = {};
    body[FIELD_MESSAGE] = userText;
    body[FIELD_SESSION] = sessionId;

    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'ngrok-skip-browser-warning': 'true'
      },
      body: JSON.stringify(body)
    });

    if (!res.ok){
      throw new Error('El webhook respondió con estado ' + res.status);
    }

    const rawText = await res.text();
    if (!rawText || !rawText.trim()){
      throw new Error('El webhook respondió con el body vacío.');
    }

    let data;
    try {
      data = JSON.parse(rawText);
    } catch (e){
      data = rawText;
    }
    return extractResponseText(data, FIELD_RESPONSE);
  }

  async function sendMessage(){
    const text = msgInput.value.trim();
    if (!text) return;
    addBubble('user', text, false);
    msgInput.value = '';
    autoresize();
    enableChat(false);
    setStatus('busy', 'Esperando respuesta…');
    addTyping();
    try {
      const reply = await callWebhook(text);
      removeTyping();
      addBubble('bot', reply, false);
      setStatus('online', 'Conectado');
    } catch (err){
      removeTyping();
      addBubble('bot', 'Error al contactar al agente: ' + err.message, true);
      setStatus('error', 'Error de conexión');
    } finally {
      enableChat(true);
      msgInput.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  // Conectar automáticamente al cargar la página
  (async function connect(){
    setStatus('busy', 'Conectando…');
    try {
      const reply = await callWebhook('Hola');
      setStatus('online', 'Conectado');
      enableChat(true);
      addBubble('bot', reply, false);
      msgInput.focus();
    } catch (err){
      setStatus('error', 'No se pudo conectar');
      emptyState.querySelector('.big').textContent = 'No se pudo conectar con el agente';
      emptyState.querySelector('.small').textContent = err.message;
    }
  })();
})();
</script>

</body>
</html>
